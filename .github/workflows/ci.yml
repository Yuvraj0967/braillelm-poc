name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,serve]"
      - run: ruff check .
      - name: Converter matches every published liblouis row
        run: python -m braillelm.pipelines.check_converter
      - name: Unit tests and model regression gate
        run: pytest -q

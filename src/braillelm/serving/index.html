<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrailleLM</title>
<style>
:root{
  --bg:#f6f4ef; --card:#fffdf8; --ink:#1d1b16; --muted:#6b665a; --line:#ddd7c8;
  --accent:#0b5d57; --accent-ink:#fff; --good:#17663a; --bad:#a3261c; --warn:#8a5a00;
  --dot:#1d1b16; --dot-off:#e4dfd1; --hl:#ffe9a8; --bad-bg:#fbe0dc; --good-bg:#dff1e4;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15171a; --card:#1d2024; --ink:#ecebe6; --muted:#9a9a92; --line:#33373d;
    --accent:#4fc3b5; --accent-ink:#06211e; --good:#6fd08d; --bad:#ff8a7c; --warn:#f0c060;
    --dot:#ecebe6; --dot-off:#33373d; --hl:#5a4a12; --bad-bg:#4a1f1b; --good-bg:#173524; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:2rem;margin:0 0 2px;letter-spacing:-.02em}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px;font-weight:600}
p.lede{margin:0 0 22px;color:var(--muted);font-size:1.1rem;max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-size:1.8rem;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{color:var(--muted);font-size:.88rem}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:12px 14px;font:inherit;font-size:1.25rem;line-height:1.5;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:14px}
.row label{font-size:.94rem;color:var(--muted)}
input[type=range]{width:170px;vertical-align:middle;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;vertical-align:-2px}
button.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 26px;font:inherit;font-weight:600;font-size:1.02rem;cursor:pointer}
button.go:disabled{opacity:.6;cursor:progress}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{font-size:.88rem;padding:5px 11px;border-radius:999px}
.answer{border:2px solid var(--accent);border-radius:12px;padding:14px 16px;margin-top:6px}
.answer .txt{font-size:1.5rem;line-height:1.5;overflow-wrap:anywhere;min-height:1.6em}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:.86rem;color:var(--muted);margin-top:8px}
.other{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:12px}
.other .who{font-size:.84rem;color:var(--muted);margin-bottom:2px}
.other .txt{font-size:1.1rem;overflow-wrap:anywhere}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:600}
.badge.ok{background:var(--good-bg);color:var(--good)} .badge.no{background:var(--bad-bg);color:var(--bad)}
.txt span.w{background:var(--bad-bg);color:var(--bad);border-radius:3px}
.txt span.lc{border-bottom:2px dotted var(--warn)}
.txt span.on{background:var(--hl)}
.tape{display:flex;flex-wrap:wrap;gap:4px 3px}
.cell{width:22px;padding:4px 0;border-radius:5px;border:1px solid transparent;text-align:center}
.cell.sp{width:10px}
.cell.dmg{border-color:var(--bad);background:var(--bad-bg)}
.cell.on{background:var(--hl)}
.dots{display:grid;grid-template-columns:6px 6px;grid-auto-flow:column;grid-template-rows:repeat(3,6px);gap:2px;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--dot-off)}
.dots i.f{background:var(--dot)}
.err{color:var(--bad);margin:12px 0 0}
.note{color:var(--muted);font-size:.88rem;margin:0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 20px}
summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:.94rem;margin-top:12px}
th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>BrailleLM</h1>
  <p class="lede">Reads braille into text, and keeps reading correctly when dots are missing or wrong.</p>

  <section class="stats" id="stats" aria-label="Measured results"></section>

  <section class="card" aria-label="Input">
    <textarea id="inp" aria-label="English text or braille" spellcheck="false" placeholder="Type a sentence in English, or paste braille"></textarea>
    <div class="row">
      <button class="go" id="go">Read</button>
      <label>Damage the braille:
        <input type="range" id="noise" min="0" max="10" step="1" value="0" aria-describedby="noiseVal">
        <span id="noiseVal">off</span>
      </label>
      <button class="ghost" id="reroll" hidden>Different damage</button>
      <label><input type="checkbox" id="fix"> Repair damaged cells</label>
    </div>
    <p class="err" id="err" role="alert" hidden></p>
    <h2 style="margin-top:20px">Or try a sentence the model has never seen</h2>
    <div class="chips" id="chips"></div>
  </section>

  <section class="card" id="result" hidden aria-live="polite">
    <h2>Braille <span id="dmgNote" style="text-transform:none;letter-spacing:0"></span></h2>
    <div class="tape" id="tape"></div>

    <h2 style="margin-top:20px">BrailleLM reads</h2>
    <div class="answer">
      <div class="txt" id="aTxt"></div>
      <div class="meta"><span id="aBadge"></span><span id="aMeta"></span></div>
    </div>

    <div class="other" id="ruleBox" hidden>
      <div class="who">A conventional rule-based braille reader, given the same cells <span id="rBadge"></span></div>
      <div class="txt" id="rTxt"></div>
    </div>
    <div class="other" id="refBox" hidden>
      <div class="who">Original text</div>
      <div class="txt" id="refTxt"></div>
    </div>
  </section>

  <details id="proof" hidden>
    <summary>How this was measured</summary>
    <div class="scroll"><table id="noiseTable"></table></div>
    <p class="note" style="margin-top:12px" id="scope"></p>
  </details>
</main>
<script>
const $ = id => document.getElementById(id);
let seed = 1, current = null, META = {};
const isBraille = s => /[⠀-⣿]/.test(s);
const GRADE_NAME = { g1: "uncontracted braille (Grade 1)", g2: "contracted braille (Grade 2)" };

function pct(x){ return (100*x).toFixed(1) + "%"; }
function el(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; }

$("noise").oninput = () => {
  const v = +$("noise").value;
  $("noiseVal").textContent = v ? v + "% of cells get a wrong dot" : "off";
  $("reroll").hidden = !v;
  $("fix").checked = v > 0;
};
$("reroll").onclick = () => { seed++; run(); };
$("go").onclick = () => run();
$("fix").onchange = () => { if (!$("result").hidden) run(); };
$("inp").addEventListener("input", () => current = null);
$("inp").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); run(); } });

// Mark characters of hyp that are not part of the longest common subsequence with ref.
function wrongMask(hyp, ref){
  const n = hyp.length, m = ref.length;
  if (n * m > 4e6) return new Array(n).fill(false);
  const W = m + 1, dp = new Uint16Array((n + 1) * W);
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i*W+j] = hyp[i] === ref[j] ? dp[(i+1)*W+j+1] + 1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
  const bad = new Array(n).fill(true);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (hyp[i] === ref[j]) { bad[i] = false; i++; j++; }
    else if (dp[(i+1)*W+j] >= dp[i*W+j+1]) i++; else j++;
  }
  return bad;
}

function paint(target, text, ref, chars){
  target.textContent = "";
  const bad = ref ? wrongMask(text, ref) : null;
  [...text].forEach((c, i) => {
    const s = el("span", null, c);
    if (bad && bad[i]) s.classList.add("w");
    if (chars && chars[i]) {
      if (chars[i].p < 0.7) s.classList.add("lc");
      s.title = "confidence " + pct(chars[i].p);
      s.onmouseenter = () => light(chars[i].cell, s, true);
      s.onmouseleave = () => light(chars[i].cell, s, false);
    }
    target.appendChild(s);
  });
}
function light(cell, span, on){
  span.classList.toggle("on", on);
  const c = $("tape").children[cell];
  if (c) c.classList.toggle("on", on);
}
function badge(target, exact, yes, no){
  target.textContent = "";
  if (exact == null) return;
  target.appendChild(el("span", "badge " + (exact ? "ok" : "no"), exact ? yes : no));
}

async function run(){
  $("err").hidden = true;
  const typed = $("inp").value.trim();
  const body = { noise: +$("noise").value / 100, seed, grade: "auto" };
  if (current) { body.braille = current.braille; body.reference = current.print; body.baseline = current.baseline || null; body.grade = current.grade || "auto"; }
  else if (isBraille(typed)) body.braille = typed;
  else body.print = typed;
  $("go").disabled = true;
  try {
    const r = await fetch("/api/translate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Request failed");
    show(d);
  } catch (e) { $("err").textContent = e.message; $("err").hidden = false; }
  finally { $("go").disabled = false; }
}

function show(d){
  $("result").hidden = false;
  const fix = $("fix").checked, ans = fix ? d.repair : d.faithful, exact = fix ? d.repair_exact : d.faithful_exact;
  paint($("aTxt"), ans.text, d.reference, ans.chars);
  badge($("aBadge"), exact, "matches the original", "differs from the original");
  $("aMeta").textContent = `${GRADE_NAME[d.grade] || ""} · ${ans.cells} cells · ${ans.ms} ms`;
  // The conventional reader is shown when it is the interesting contrast: damaged input, or it got this one wrong.
  const showRule = d.rule.text != null && (d.damaged > 0 || d.rule_exact === false);
  $("ruleBox").hidden = !showRule;
  if (showRule) { paint($("rTxt"), d.rule.text, d.reference, null); badge($("rBadge"), d.rule_exact, "matches the original", "differs from the original"); }
  const showRef = !!d.reference && (exact === false || (showRule && d.rule_exact === false));
  $("refBox").hidden = !showRef;
  if (showRef) $("refTxt").textContent = d.reference;
  $("dmgNote").textContent = d.damaged ? "· " + d.damaged + " damaged cell" + (d.damaged > 1 ? "s" : "") + " outlined in red" : "";
  const tape = $("tape"); tape.textContent = "";
  d.cells.forEach(c => {
    const box = el("div", "cell" + (c.space ? " sp" : "") + (c.damaged ? " dmg" : ""));
    if (!c.space) {
      const dots = el("div", "dots");
      for (let k = 1; k <= 6; k++) dots.appendChild(el("i", c.dots.includes(k) ? "f" : ""));
      box.appendChild(dots);
    }
    tape.appendChild(box);
  });
}

function stat(big, label){
  const s = el("div", "stat");
  s.appendChild(el("b", null, big)); s.appendChild(el("span", null, label));
  return s;
}

// Headline numbers pool both braille grades: every figure is a sum of counts from the saved evaluation.
function render(){
  const m = META.metrics || {}, grades = Object.values(m.grades || {}), st = $("stats");
  st.textContent = "";
  if (grades.length) {
    const n = grades.reduce((a, g) => a + g.n, 0), ok = grades.reduce((a, g) => a + g.exact, 0);
    st.appendChild(stat(pct(ok / n), `of unseen test sentences read exactly right (${ok} of ${n})`));
    const pick = g => g.noise.find(r => r.sentences_damaged != null && r.rule != null);
    if (grades.every(pick)) {
      const rows = grades.map(pick), dn = rows.reduce((a, r) => a + r.n, 0);
      const mine = rows.reduce((a, r) => a + r.neural_exact, 0), theirs = rows.reduce((a, r) => a + r.rule_exact, 0);
      st.appendChild(stat(pct(mine / dn), `still exactly right when ${rows[0].label.split(" ")[0]} of cells are damaged. Conventional readers: ${pct(theirs / dn)}`));
    }
    if (m.params) st.appendChild(stat((m.params/1e6).toFixed(1) + "M", "parameters. One small model, runs on an ordinary CPU"));
  }
  const t = $("noiseTable"); t.textContent = "";
  $("proof").hidden = !grades.length;
  if (grades.length) {
    const head = el("tr"); ["Braille", "Input", "BrailleLM exact", "Conventional reader exact"].forEach(h => head.appendChild(el("th", null, h)));
    t.appendChild(head);
    Object.entries(m.grades).forEach(([g, G]) => G.noise.filter(r => r.mode === "repair" ? r.sentences_damaged != null : true).forEach(r => {
      const tr = el("tr");
      [g === "g1" ? "Uncontracted (Grade 1)" : "Contracted (Grade 2)", r.label, `${pct(r.neural)} (${r.neural_exact}/${r.n})`,
       r.rule == null ? "n/a" : `${pct(r.rule)} (${r.rule_exact}/${r.n})`].forEach(v => tr.appendChild(el("td", null, v)));
      t.appendChild(tr);
    }));
    $("scope").textContent = "Whole sentences, character for character, on 399 test sentences per braille type that were never used for training. "
      + "The conventional reader is a lookup table for uncontracted braille and liblouis for contracted braille. "
      + "Test braille is machine-generated and the damage is simulated: this has not yet been validated on braille produced by people or captured by a device.";
  }
  const chips = $("chips"); chips.textContent = "";
  const all = META.samples || [], g2 = all.filter(s => s.grade === "g2"), g1 = all.filter(s => s.grade !== "g2");
  const mixed = g2.length ? [g2[0], g1[1], g2[2], g1[3], g2[4], g1[5]].filter(Boolean) : g1.slice(0, 6);
  mixed.forEach((s, i) => {
    const b = el("button", "ghost", s.label || ("Sentence " + (i + 1)));
    b.onclick = () => { $("inp").value = s.braille; current = s; seed = 1; run(); };
    chips.appendChild(b);
  });
}

async function init(){
  META = await (await fetch("/api/meta")).json();
  render();
  const q = new URLSearchParams(location.search);
  if (q.get("sample") && $("chips").children[+q.get("sample") - 1]) $("chips").children[+q.get("sample") - 1].click();
}
init();
</script>
</body>
</html>

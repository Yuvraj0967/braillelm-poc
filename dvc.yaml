# Reproducible pipeline for BrailleLM v3 (Grade 1 + Grade 2). `dvc repro` rebuilds
# only the stages whose inputs changed; `dvc dag` shows the graph. The same steps
# are plain commands in the Makefile, and kaggle/train_v3.py runs them on a
# Kaggle GPU, so DVC is optional.
#
# build_data_g2 needs liblouis (apt-get install liblouis-bin liblouis-data).
# train is meant for a GPU: about two hours on a Tesla T4.
stages:
  check_converter:
    cmd: python -m braillelm.pipelines.check_converter
    deps:
      - src/braillelm/braille_g1.py
      - legacy/neural_mac/data

  build_data_g2:
    cmd: python -m braillelm.pipelines.build_data_g2 --out data/v3
    deps:
      - src/braillelm/pipelines/build_data_g2.py
      - src/braillelm/braille_g1.py
      - src/braillelm/louis.py
      - legacy/neural_mac/data
    outs:
      - data/v3

  train:
    cmd: python -m braillelm.pipelines.train --config configs/train_g2.yaml --data data/v3 --out runs/v3
    deps:
      - src/braillelm/pipelines/train.py
      - src/braillelm/model.py
      - src/braillelm/noise.py
      - configs/train_g2.yaml
      - data/v3
    outs:
      - runs/v3

  evaluate:
    cmd: >-
      python -m braillelm.pipelines.evaluate --ckpt runs/v3/best.pt --data data/v3
      --files final_test pilot_plain pilot_extended digits_test apostrophe_test unusual_test everyday_test
      --out reports --train data/v3/train.jsonl
    deps:
      - src/braillelm/pipelines/evaluate.py
      - runs/v3
      - data/v3
    metrics:
      - reports/metrics.json:
          cache: false

  export:
    cmd: python -m braillelm.pipelines.export_onnx --ckpt runs/v3/best.pt
    deps:
      - src/braillelm/pipelines/export_onnx.py
      - runs/v3
    outs:
      - models/braillelm_v3/braillelm_v3.onnx:
          cache: false
      - models/braillelm_v3/model_card.json:
          cache: false

  summary:
    cmd: python -m braillelm.pipelines.make_summary
    deps:
      - src/braillelm/pipelines/make_summary.py
      - reports/metrics.json
    outs:
      - reports/summary.json:
          cache: false
      - src/braillelm/serving/samples.json:
          cache: false
